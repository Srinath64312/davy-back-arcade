[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "davy-back-arcade"
version = "2.0.0"
description = "Davy Back Arcade: A 100% loop-free Python game engine and multi-game pirate web arcade featuring Tic-Tac-Toe, Sudoku, Ludo Royale, Gravity-Toe, and Dots & Boxes"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Naveen Kumar" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
loopless-tictactoe = "main:dispatch_argument"
